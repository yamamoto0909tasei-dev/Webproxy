<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>簡易Webプロキシ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; background: #f0f2f5; }
    .header { padding: 10px; background: #333; display: flex; gap: 8px; }
    input[type="url"] { flex: 1; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 10px 16px; font-size: 16px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:active { background: #0056b3; }
    iframe { flex: 1; border: none; width: 100%; height: 100%; background: white; }
  </style>
</head>
<body>

  <div class="header">
    <input type="url" id="targetUrl" placeholder="https://example.com" value="https://example.com">
    <button onclick="loadSite()">表示</button>
  </div>

  <iframe id="viewer" src="about:blank"></iframe>

  <script>
    function loadSite() {
      let url = document.getElementById('targetUrl').value.trim();
      if (!url) return;
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
      }
      // CORS回避用公開プロキシAPIを経由して表示
      document.getElementById('viewer').src = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url);
    }
    // 初期読み込み
    window.onload = loadSite;
  </script>

</body>
</html>
